[package]
name = "mailserver-web"
version = "0.1.23"
edition = "2021"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
dotenvy = "0.15.7"
const_format = "0.2.34"#compile-time string formatting
anyhow = "1.0.97"#error handling
thiserror = "2.0.12"
mailserver-web-macro = { path = "../macro" }
askama = "0.16.0" #template engine

#logging
log = "0.4.26"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

flate2 = "1.1.0" #compression
base64 = "0.22.1"
serde = { version = "1.0.130", features = ["derive"] } #serialization
serde_json = "1.0.68" #json serialization

#crypto stuff
password-hash = { version = "0.6.0", features = ["phc", "rand_core", "getrandom"] }
argon2 = "0.6.0-rc.8"
sha-crypt = { version = "0.6.0", optional = true }
scrypt = "0.12.0"
pbkdf2 = "0.13.0"
bcrypt-pbkdf = "0.11.0"
rand = "0.10.0"
rsa = "0.9.8"
pkcs1 = "0.7.5"
pkcs8 = "0.11.0"
const-oid = { version = "0.10.2", features = ["db"] }

#generic tech-stack
actix-web = { version = "4.14.0", features = ["secure-cookies"] }
tokio = "1.43.1"
futures = "0.3.33"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"]}


systemd = { version = "0.10.1", optional = true }
libc = {version = "0.2.183", optional = true}

[features]
sha-crypt = ["dep:sha-crypt"]
socket = []
systemd-socket = ["dep:systemd", "dep:libc", "socket"]